name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Отсекаем комментарии ботов (включая ответы самого агента) и ограничиваем
    # круг вызывающих участниками проекта. Команда вызова сужена до /oc.
    if: |
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    permissions:
      # id-token нужен для OIDC-обмена на токен GitHub App; запись выполняет
      # приложение, поэтому раннеру хватает чтения.
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: '/oc'
          share: false
